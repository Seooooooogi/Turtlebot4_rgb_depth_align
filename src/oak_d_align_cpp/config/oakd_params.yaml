/**/oakd_sender:
  ros__parameters:
    # 토픽 namespace 는 노드 namespace (launch PushRosNamespace 또는 ROBOT_NAMESPACE) 로 결정.
    # 코드는 상대 경로만 선언 (Rule 5). YAML 의 robot_namespace 키는 더 이상 없음.

    # Camera settings
    fps: 30.0
    stereo_preset: "HIGH_DENSITY"    # HIGH_DENSITY (중거리) | HIGH_ACCURACY (근거리 정밀)
    stereo_subpixel: true

    # RGB ISP downscale: sensor 1920×1080 → (num/den) × (1920×1080)
    # (2,3) → 1280×720, (1,3) → 640×360, (1,2) → 960×540.
    # 640×360 적용 — TurtleBot4 RPi4 USB/CPU 부하 절감 목적 (compressedDepth Hz 회복).
    rgb_isp_num: 1
    rgb_isp_den: 3

    # StereoDepth 후처리 필터 — depth raw 노이즈 감소.
    # median: "OFF" | "KERNEL_3x3" | "KERNEL_5x5" | "KERNEL_7x7"
    # confidence_threshold: 0~255 (높을수록 명확한 pixel 만, hole ↑)
    # 후처리 필터 — 비교 baseline 위해 모두 비활성 (preset 자동값만).
    # 활성화 시: median "KERNEL_7x7" / confidence 200 / subpixel_bits 5 /
    #           speckle true (50) / threshold true (200~5000).
    stereo_median_filter: "OFF"
    stereo_confidence_threshold: 245   # HIGH_DENSITY preset default
    subpixel_fractional_bits: 3        # depthai default
    speckle_filter_enabled: false
    speckle_range: 50
    threshold_filter_enabled: false
    threshold_min_mm: 200
    threshold_max_mm: 5000

    # Overlay blend (0.0 = full RGB, 1.0 = full depth). enable_overlay 가 true 일 때만 사용.
    overlay_alpha: 0.5
    use_color_map: false
    jpeg_quality_overlay: 80
    enable_overlay: false    # 기본 비활성 (CPU 절약). 검증 시에만 true 로 토글.

    # Distance measurement ROI (픽셀) — 현재 C++ 포트는 미사용
    roi_size: 5

    # Active illumination — 4m 정밀도 향상 핵심
    # 0.0 = off, 1.0 = max intensity
    # RPi4 사용 시 IR 활성화하면 전력 900mA 초과 가능 → Y-adapter 권장
    ir_dot_projector_intensity: 0.0
    ir_flood_intensity: 0.0
