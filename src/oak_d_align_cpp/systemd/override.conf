# systemd drop-in for turtlebot4.service — swap vendor oakd.launch.py for
# oak_d_align_cpp turtlebot4_bringup.launch.py.
#
# Install path:
#   /etc/systemd/system/turtlebot4.service.d/override.conf
#
# Install commands (run on TurtleBot4):
#   sudo install -d /etc/systemd/system/turtlebot4.service.d
#   sudo install -m 0644 \
#     ~/turtlebot_align_ws/src/oak_d_align_cpp/systemd/override.conf \
#     /etc/systemd/system/turtlebot4.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart turtlebot4.service
#
# Vendor immutability: the unit file at /lib/systemd/system/turtlebot4.service
# is NOT modified. systemd merges this drop-in on top.
#
# Replaces the vendor ExecStart (which runs /usr/sbin/turtlebot4-start →
# robot_upstart mklaunch over /etc/ros/humble/turtlebot4.d/, which symlinks
# to vendor standard.launch.py and pulls in oakd.launch.py).
#
# Preserves:
#   - /etc/turtlebot4/setup.bash (ROBOT_NAMESPACE, FastDDS profile, RMW, etc.)
#   - /opt/ros/humble (vendor ROS install) via WORKSPACE_SETUP
#   - setpriv --reuid ubuntu (drops to unprivileged user, same as vendor)
# Adds:
#   - Sources our colcon overlay so `ros2 launch oak_d_align_cpp ...` resolves.

[Service]
ExecStart=
# setpriv preserves env but does not reset HOME for the reuid'd user, so rcutils
# cannot expand ~/.ros for the log dir. Match vendor turtlebot4-start by setting
# ROS_HOME/ROS_LOG_DIR explicitly.
ExecStart=/bin/bash -c 'source /etc/turtlebot4/setup.bash && source /home/ubuntu/turtlebot_align_ws/install/setup.bash && export HOME=/home/ubuntu && export ROS_HOME=/home/ubuntu/.ros && export ROS_LOG_DIR=/tmp && exec setpriv --reuid ubuntu ros2 launch oak_d_align_cpp turtlebot4_bringup.launch.py'
