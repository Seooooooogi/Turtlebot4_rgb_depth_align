/oakd:
  ros__parameters:
    camera:
      i_enable_imu: false
      i_enable_ir: true
      i_floodlight_brightness: 0
      i_laser_dot_brightness: 800
      i_nn_type: none
      i_pipeline_type: RGBD
      i_usb_speed: SUPER_PLUS
    rgb:
      i_board_socket_id: 0
      i_fps: 30.0
      i_resolution: '1080'
      i_isp_num: 2
      i_isp_den: 3
      i_width: 1280
      i_height: 720
      i_interleaved: false
      i_max_q_size: 10
      i_low_bandwidth: true
      i_publish_topic: true
    stereo:
      i_board_socket_id: 1
      i_fps: 30.0
      i_width: 1280
      i_height: 720
      i_depth_preset: HIGH_ACCURACY
      i_align_depth: true
      i_enable_depth: true
      i_lr_check: true
      i_subpixel: true
      i_depth_filter_size: 7
      i_max_q_size: 4
      i_left_right_check_threshold: 10
      i_disparity_width: DISPARITY_96
      i_low_bandwidth: true
    depth:
      enabled: true
      i_publish_topic: true
    use_sim_time: false
